<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — BKPSDM Kabupaten Maluku Tengah</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --biru-tua: #0d47a1; --biru: #1976d2; }
        body { background: linear-gradient(135deg, var(--biru-tua) 0%, var(--biru) 100%); min-height: 100vh; display:flex; align-items:center; }
        .card { border:none; border-radius:16px; box-shadow:0 8px 32px rgba(0,0,0,0.15); }
        .btn-primary { background:var(--biru); border-color:var(--biru); }
        .btn-primary:hover { background:var(--biru-tua); border-color:var(--biru-tua); }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-4">
                <div class="text-center mb-4">
                     <img src="logo-bkpsdm.png" alt="Logo BKPSDM Kabupaten Maluku Tengah" style="max-width: 120px; max-height: 120px; margin-bottom: 10px;">
   		     <br>
    		     <!-- Ikon tetap bisa dipertahankan atau dihapus -->
  		     <h4 class="fw-bold">BKPSDM</h4>
  		     <p class="text-muted">Kabupaten Maluku Tengah</p>
   	            <h5 class="fw-semibold">Sistem Persuratan & Disposisi</h5>
		</div>
                <form id="formLogin">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nama Lengkap</label>
                        <input type="text" class="form-control" id="namaPengguna" placeholder="Masukkan nama Anda" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Peran / Jabatan <span class="text-danger">*</span></label>
                        <select class="form-select" id="peranPengguna" required>
                            <option value="">-- Pilih Peran --</option>
                            <option value="admin">?? Administrator — Hapus & Kelola Semua Data</option>
                            <option value="kepala">?? Kepala BKPSDM</option>
                            <option value="staf">?? Staf / Operator</option>
                            <option value="pemantau">?? Pemantau / Lihat Saja</option>
                        </select>
                        <small class="text-muted">?? Hanya <strong>Administrator</strong> yang dapat menghapus data</small>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Kata Sandi</label>
                        <input type="password" class="form-control" id="kataSandi" placeholder="Masukkan kata sandi" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                        <i class="fas fa-sign-in-alt me-2"></i> Masuk ke Sistem
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('formLogin').addEventListener('submit', function(e) {
    e.preventDefault();
    const nama = document.getElementById('namaPengguna').value.trim();
    const peran = document.getElementById('peranPengguna').value;
    const sandi = document.getElementById('kataSandi').value;

    if (!nama || !peran) {
        alert('?? Lengkapi nama dan peran terlebih dahulu!');
        return;
    }

    localStorage.setItem('namaPengguna', nama);
    localStorage.setItem('peranPengguna', peran);
    alert('? Selamat datang, ' + nama + '!\nPeran: ' + peranNama(peran));
    location.href = 'dashboard.html';
});

function peranNama(p) {
    const map = {admin:'Administrator', kepala:'Kepala BKPSDM', staf:'Staf/Operator', pemantau:'Pemantau'};
    return map[p] || p;
}
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
